name: 'golangci-lint'
description: 'Run golangci-lint with configurable options'
author: 'sivchari'

inputs:
  go-version-file:
    description: 'Path to go.mod file for Go version detection'
    required: false
    default: 'go.mod'
  working-directory:
    description: 'Working directory to run linter in'
    required: false
    default: '.'
  golangci-lint-version:
    description: 'Version of golangci-lint to use'
    required: false
    default: 'latest'
  args:
    description: 'Additional arguments to pass to golangci-lint'
    required: false
    default: ''
  timeout:
    description: 'Timeout for golangci-lint execution'
    required: false
    default: '5m'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: true
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum

    # install.sh matches checksums with a bare grep, so since v2.15.0 the
    # *.tar.gz.sbom.json line also matches and verification always fails.
    # The official action downloads the release archive directly.
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: ${{ inputs.golangci-lint-version }}
        install-only: true
        working-directory: ${{ inputs.working-directory }}

    - name: Run golangci-lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        golangci-lint run ./... --timeout ${{ inputs.timeout }} -v ${{ inputs.args }}

    - name: Check code formatting
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        golangci-lint fmt ./... -v ${{inputs.args }}

branding:
  icon: 'shield'
  color: 'blue'
